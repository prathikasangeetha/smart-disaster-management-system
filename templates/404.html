{% extends 'base.html' %}

{% block title %}404 Page Not Found - Smart Disaster Management{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-danger mb-2">404</div>
        <h2 class="fw-bold mb-3">Page Not Found</h2>
        <p class="text-muted max-w-500 mx-auto mb-4">The page or report record you were looking for does not exist or has been relocated.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg px-4">
            <i class="fas fa-home me-2"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
