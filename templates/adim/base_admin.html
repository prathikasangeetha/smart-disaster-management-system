{% extends 'base.html' %}

{% block title %}Admin Panel - Smart Disaster Management{% endblock %}

{% block content %}
<div class="admin-wrapper">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
        <div class="px-3 mb-4">
            <h6 class="text-uppercase text-muted small fw-bold mb-1">Control Panel</h6>
            <div class="fw-bold text-white fs-5"><i class="fas fa-user-shield text-danger me-2"></i>Admin Console</div>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link {% if request.endpoint == 'admin.dashboard' %}active{% endif %}" href="{{ url_for('admin.dashboard') }}">
                <i class="fas fa-tachometer-alt me-2"></i> Dashboard Overview
            </a>
            <a class="nav-link {% if request.endpoint == 'admin.reports' %}active{% endif %}" href="{{ url_for('admin.reports') }}">
                <i class="fas fa-exclamation-triangle me-2"></i> Manage Reports
            </a>
            <a class="nav-link {% if request.endpoint == 'admin.shelters' %}active{% endif %}" href="{{ url_for('admin.shelters') }}">
                <i class="fas fa-hospital-user me-2"></i> Manage Shelters
            </a>
            <a class="nav-link {% if request.endpoint == 'admin.alerts' %}active{% endif %}" href="{{ url_for('admin.alerts') }}">
                <i class="fas fa-broadcast-tower me-2"></i> Emergency Alerts
            </a>
            <a class="nav-link {% if request.endpoint == 'admin.users' %}active{% endif %}" href="{{ url_for('admin.users') }}">
                <i class="fas fa-users-cog me-2"></i> Manage Users
            </a>
        </nav>
        <hr class="border-secondary my-4">
        <div class="px-3">
            <a href="{{ url_for('main.index') }}" class="btn btn-outline-light btn-sm w-100">
                <i class="fas fa-arrow-left me-1"></i> Public Website
            </a>
        </div>
    </aside>

    <!-- Admin Main Body -->
    <main class="admin-content">
        {% block admin_content %}{% endblock %}
    </main>
</div>
{% endblock %}
